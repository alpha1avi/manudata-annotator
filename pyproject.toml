[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manudata-qc-render"
version = "0.1.0"
description = "Hand-pose QC render pipeline for ManuData egocentric manipulation data"
requires-python = ">=3.10"

# Pinned exactly: these are the versions the tool was developed and
# tested against. The render path deliberately needs no GPU and no torch,
# so a workstation can re-render from cached keypoints with just these.
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
# WiLoR inference.
#
# torch and torchvision are deliberately NOT pinned here. The correct build
# depends on the GPU: Blackwell (RTX 50-series, sm_120) needs cu128 wheels,
# older cards work on cu121. Pinning an exact version in this extra would
# silently downgrade a correctly-installed CUDA build back to a generic one
# the moment this package is installed.
#
# Install torch first, from the index matching the card — scripts/
# vast_bootstrap.sh does this automatically, and VAST_SETUP.md documents it.
wilor = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics==8.3.40",
]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
manudata-qc-render = "qc.cli:main"

[tool.setuptools]
packages = [
    "qc",
    "qc.io",
    "qc.pose",
    "qc.render",
    "qc.report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
